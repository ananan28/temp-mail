name: Deploy temporary inbox
on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'style.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: temp-mail-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          touch _site/.nojekyll
          node --check app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clear stalled previous Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ananan28/temp-mail/pages/deployments/410fb59c549129d2f2e1e6808946757823153bbf || true
          gh api --method POST repos/ananan28/temp-mail/pages/deployments/410fb59c549129d2f2e1e6808946757823153bbf/cancel || true
          for attempt in $(seq 1 12); do
            state=$(gh api repos/ananan28/temp-mail/pages/deployments/410fb59c549129d2f2e1e6808946757823153bbf --jq '.status' || true)
            echo "Previous Pages deployment: $state"
            case "$state" in
              succeeded|cancelled|canceled|failed|deployment_failed) break ;;
            esac
            sleep 5
          done
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
