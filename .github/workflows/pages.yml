name: Validate temporary inbox
on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'style.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: node --check app.js
