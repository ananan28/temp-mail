name: Deploy temporary inbox
on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'style.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: temp-mail-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Recover Pages branch publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/ananan28/temp-mail/pages -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
          gh api --method POST repos/ananan28/temp-mail/pages/builds
