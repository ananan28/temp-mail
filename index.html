<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临时邮箱</title>
<link rel="stylesheet" href="./style.css?v=20261012-19">
<body><main><div class="intro">
<h1>你的临时收件箱</h1><p>自动生成地址，接收邮件，无需注册。</p>
</div><div class="workspace"><section class="controls"><label for="domain">邮箱后缀</label><select id="domain" disabled><option value="box.hahjxbnb.com" disabled>box.hahjxbnb.com（配置中）</option><option value="code.hahjxbnb.com" disabled>code.hahjxbnb.com（配置中）</option><option value="xzckfn.eu.cc" selected>xzckfn.eu.cc</option></select><label for="address">当前邮箱地址</label><input id="address" readonly placeholder="正在连接…">
<div class="actions"><button id="copy" disabled>复制地址</button><button id="create" disabled>生成新地址</button></div>
<div class="random-tools" aria-label="随机资料"><div class="random-field"><label for="random-name">随机名字</label><div class="random-row"><input id="random-name" readonly><button id="copy-name" type="button">复制</button><button id="new-name" type="button">换一个</button></div></div><div class="random-field"><label for="random-password">随机密码（8–14 位）</label><div class="random-row"><input id="random-password" readonly autocomplete="off" spellcheck="false"><button id="copy-password" type="button">复制</button><button id="new-password" type="button">换一个</button></div></div><p id="random-status" role="status" aria-live="polite">仅在当前页面生成，不上传或保存。</p></div>
<button id="reconnect" hidden>重新建立身份（新收件箱）</button><p id="expiry"></p><p id="status" role="status" aria-live="polite">正在连接…</p></section>
<section class="inbox-panel"><div class="inbox-heading"><h2>收件箱</h2><button id="refresh" disabled>↻ 刷新邮件</button></div><div class="mail-content"><div id="list"></div>
<section id="detail" hidden><h2 id="subject"></h2><p id="sender"></p><div id="body" class="email-body"></div></section></div></section></div>
<footer>独立收件箱 · 到期停用 · 不转发到主邮箱</footer></main>
<script type="module" src="./app.js?v=20261012-19"></script></body></html>
