<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临时邮箱</title>
<link rel="stylesheet" href="./style.css">
<body><main><header><span>Kelly Khoo · 临时邮箱</span><small>独立收件箱 · 24 小时有效</small></header>
<h1>你的临时收件箱</h1><p>自动生成地址，接收邮件，无需注册。</p>
<section><label for="address">当前邮箱地址</label><input id="address" readonly placeholder="正在连接…">
<div class="actions"><button id="copy" disabled>复制地址</button><button id="create" disabled>生成新地址</button><button id="refresh" disabled>刷新邮件</button></div>
<p id="expiry"></p><p id="status" role="status" aria-live="polite">正在连接…</p></section>
<section><h2>收件箱</h2><div id="list"></div></section>
<section id="detail" hidden><h2 id="subject"></h2><p id="sender"></p><div id="body" class="email-body"></div></section>
<footer>收件箱仅当前浏览器身份可访问。清除浏览器数据后无法恢复。到期后停用；不会转发到主邮箱。</footer></main>
<script type="module" src="./app.js"></script></body></html>
